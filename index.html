<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement Test · Renan Lemes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap">
<style>
:root{
  --plum:#5f3e66;--plum-deep:#2f2934;--teal:#00736a;--teal-light:#4c9b8f;--lilac:#bc94c4;
  --lilac-soft:#f6f4f8;--line:#e5e0e7;--cream:#f4f3ed;--surface:#fff;--ink:#2f2934;--muted:#69646f;
  --highlight:#f1d570;--butter:#fdf6e1;--teal-soft:#e6efec;--sand:#ddd6c3;
  --r-md:16px;--r-lg:28px;--shadow:0 8px 24px rgba(95,62,102,.08);--shadow-btn:0 6px 16px rgba(0,115,106,.30);
  --display:"Fredoka",system-ui,sans-serif;--sans:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--lilac-soft);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--plum)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(246,244,248,.92);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;color:var(--plum)}
.brand b span{color:var(--teal)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:3px}
.top .spacer{flex:1}
.stat{font-family:var(--display);font-weight:600;font-size:15px;color:var(--plum);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.stat.timer{color:var(--teal)}
.progress{position:absolute;left:0;bottom:-1.5px;height:3px;background:var(--teal-light);width:0;transition:width .4s ease-out}

/* pills */
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 8px}
.pill{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);color:var(--plum);border-radius:999px;padding:8px 18px 8px 8px;font-family:var(--display);font-weight:600;font-size:16px;transition:all .25s ease-out}
.pill .n{width:30px;height:30px;border-radius:50%;background:var(--lilac-soft);display:grid;place-items:center;font-size:14px}
.pill .c{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted)}
.pill.active{background:var(--plum);border-color:var(--plum);color:#fff}
.pill.active .n{background:rgba(255,255,255,.18)}
.pill.active .c{color:rgba(255,255,255,.75)}
.pill:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--plum) 0%,#4f4a6a 55%,var(--teal) 130%);color:#fff;padding:56px 48px;margin:28px 0}
.hero h1{color:#fff;font-size:clamp(40px,6vw,72px);line-height:1.02;font-weight:700;max-width:640px}
.hero p.lead{font-size:21px;max-width:560px;color:rgba(255,255,255,.88);margin:18px 0 0}
.eyebrow{display:inline-block;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.hero .eyebrow{background:rgba(255,255,255,.14);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.hero-art{position:absolute;right:-60px;top:-60px;width:420px;height:420px;pointer-events:none}
@media(max-width:820px){.hero-art{opacity:.35}}

.btn{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:15px 28px;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:var(--shadow-btn);transition:transform .2s ease-out,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--plum);border:1.5px solid var(--line);box-shadow:none}
.btn.light{background:#fff;color:var(--teal);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* start */
.start-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-bottom:60px}
@media(max-width:820px){.start-grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:32px}
.card .eyebrow{color:var(--teal);margin-bottom:10px}
.field{display:block;margin:18px 0}
.field span{display:block;font-weight:600;font-size:15px;color:var(--plum);margin-bottom:6px}
.field input{width:100%;font:inherit;padding:14px 18px;border:1.5px solid var(--line);border-radius:999px;outline:none;transition:border .2s}
.field input:focus{border-color:var(--teal)}
.map{background:var(--butter);border-radius:var(--r-md);padding:18px 20px;margin:0}
.map li{margin:6px 0}
.map ol{margin:8px 0 0;padding-left:22px}
.tiny{font-size:14px;color:var(--muted)}

/* section */
.section{position:relative;margin:36px 0}
.sec-head{display:flex;align-items:flex-end;gap:22px;margin-bottom:18px}
.bignum{font-family:var(--display);font-weight:700;font-size:96px;line-height:.8;color:var(--lilac);letter-spacing:-.02em}
.sec-head h2{font-size:34px;line-height:1.1}
.sec-head .instr{color:var(--muted);margin:6px 0 0;font-size:17px}
.tag{display:inline-block;background:var(--teal-soft);color:var(--teal);font-family:var(--display);font-weight:600;font-size:13px;padding:4px 12px;border-radius:999px;margin-right:6px}

.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:820px){.qgrid{grid-template-columns:1fr}}
.q{background:#fff;border-radius:var(--r-md);border:1.5px solid var(--line);padding:20px 22px;transition:border-color .25s}
.q.done{border-color:#d9cfe0}
.q .qn{font-family:var(--display);font-weight:600;font-size:14px;color:var(--teal);letter-spacing:.06em}
.q .stem{font-weight:500;color:var(--plum-deep);margin:4px 0 14px;font-size:18px}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--lilac);margin:0 4px;transform:translateY(-3px)}
.blank.filled{border:0;background:var(--highlight);border-radius:6px;padding:0 8px;min-width:0;transform:none;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);color:var(--plum-deep);font-weight:600;border-radius:999px;padding:8px 16px 8px 8px;font-size:16px;text-align:left;transition:all .2s ease-out}
.chip .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lilac-soft);color:var(--plum);display:grid;place-items:center;font-family:var(--display);font-size:13px}
.chip:hover{border-color:var(--lilac)}
.chip.sel{background:var(--plum);border-color:var(--plum);color:#fff}
.chip.sel .l{background:rgba(255,255,255,.2);color:#fff}
.opts.col{flex-direction:column;align-items:stretch}
.opts.col .chip{border-radius:var(--r-md)}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

.reading{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.reading{grid-template-columns:1fr}}
.passage{background:var(--cream);border-radius:var(--r-lg);padding:28px 30px;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
@media(max-width:900px){.passage{position:static;max-height:none}}
.passage p{margin:0 0 14px;font-size:17px}
.passage mark{background:var(--highlight);border-radius:4px;padding:0 4px;color:inherit;font-weight:600}
.reading .qs{display:flex;flex-direction:column;gap:14px}

.writing{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:.8fr 1.2fr}
@media(max-width:820px){.writing{grid-template-columns:1fr}}
.writing .brief{background:var(--teal);color:#fff;padding:32px}
.writing .brief h3{color:#fff;font-size:26px;margin:8px 0 12px}
.writing .brief p{margin:0 0 12px;color:rgba(255,255,255,.92)}
.writing .brief .eyebrow{color:rgba(255,255,255,.75)}
.writing .pad{padding:24px}
.writing textarea{width:100%;min-height:300px;font:inherit;font-size:17px;line-height:1.6;padding:18px 20px;border:1.5px solid var(--line);border-radius:var(--r-md);outline:none;resize:vertical;color:var(--ink)}
.writing textarea:focus{border-color:var(--teal)}
.wc{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:15px;color:var(--muted)}
.wc b{font-family:var(--display);color:var(--plum)}
.wc .ok{color:var(--teal)}
.meter{height:6px;background:var(--lilac-soft);border-radius:99px;flex:1;margin:0 14px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lilac);width:0;transition:width .3s,background .3s}
.meter i.ok{background:var(--teal-light)}

.stage-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:40px 0 80px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;background:rgba(47,41,52,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modal .card{max-width:480px;animation:pop .3s ease-out}
.modal .row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}

/* results */
.res-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
@media(max-width:820px){.res-hero{grid-template-columns:1fr}}
.levelbig{font-family:var(--display);font-weight:700;font-size:clamp(52px,8vw,96px);line-height:.95;color:#fff}
.cefr{display:inline-block;background:#fff;color:var(--plum);font-family:var(--display);font-weight:700;font-size:20px;padding:6px 16px;border-radius:999px;margin-top:16px}
.ring-wrap{position:relative;width:220px;height:220px;margin:0 auto}
.ring-wrap .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--display)}
.ring-wrap .t b{font-size:58px;line-height:1;display:block}
.ring-wrap .t small{font-size:15px;opacity:.8}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.lv{border-radius:var(--r-md);padding:14px 12px;background:var(--lilac-soft);border:1.5px solid var(--line);text-align:left;transition:all .3s}
.lv b{display:block;font-family:var(--display);color:var(--plum);font-size:16px;line-height:1.15}
.lv span{font-size:13px;color:var(--muted)}
.lv.on{background:var(--plum);border-color:var(--plum)}
.lv.on b,.lv.on span{color:#fff}
@media(max-width:820px){.scale{grid-template-columns:repeat(3,1fr)}}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
@media(max-width:820px){.res-grid{grid-template-columns:1fr}}
.bar{margin:16px 0}
.bar .top2{display:flex;justify-content:space-between;font-weight:600;color:var(--plum);font-size:16px}
.bar .track{height:12px;background:var(--lilac-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar .track i{display:block;height:100%;border-radius:99px;background:var(--teal-light);width:0;transition:width .8s ease-out}
.wres{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin:12px 0}
.wres .h{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--plum)}
.badge{font-family:var(--display);font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--butter);color:var(--plum)}
.badge.ok{background:var(--teal-soft);color:var(--teal)}
.wres p{margin:8px 0 0;font-size:15px;color:var(--muted)}
.callout{background:var(--butter);border-radius:var(--r-md);padding:16px 20px;margin-top:16px;font-size:16px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--plum);color:#fff;font-family:var(--display);padding:12px 22px;border-radius:999px;opacity:0;transition:all .3s ease-out;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cando-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;background:var(--lilac-soft);border:1.5px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:var(--plum);font-family:var(--display);font-weight:600;font-size:15px;padding:8px 16px;border-radius:999px;transition:all .25s ease-out}
.seg button.on{background:var(--plum);color:#fff}
.cando-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:820px){.cando-grid{grid-template-columns:1fr}}
.skill{border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
.sk-h{font-family:var(--display);font-weight:600;font-size:20px;color:var(--plum);display:flex;gap:8px;align-items:center;margin-bottom:8px}
.skill p{margin:8px 0 0;font-size:16px}
.skill .tag{display:table;margin-bottom:4px}
.skill .next{color:var(--muted)}
.next-tag{background:var(--butter)!important;color:var(--plum)!important}
.rv-sec{font-family:var(--display);font-weight:600;color:var(--teal);font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:26px 0 10px}
.rv{border:1.5px solid var(--line);border-left:5px solid var(--teal-light);border-radius:var(--r-md);padding:14px 18px;margin:10px 0}
.rv.bad{border-left-color:var(--lilac)}
.rv .rh{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600;color:var(--plum);font-size:15px}
.rv .mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;background:var(--teal)}
.rv.bad .mark{background:var(--lilac)}
.rv .rs{margin:6px 0;font-weight:500;color:var(--plum-deep)}
.rv .ans{display:flex;flex-wrap:wrap;gap:8px;font-size:15px;margin:6px 0}
.rv .ans span{border-radius:999px;padding:3px 12px;background:var(--lilac-soft)}
.rv .ans .yours.bad{text-decoration:line-through;color:var(--muted)}
.rv .ans .right{background:var(--teal-soft);color:var(--teal);font-weight:600}
.rv .why{font-size:15px;color:var(--ink);margin:6px 0 0}
.rv .why b{color:var(--plum)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Renan <span>Lemes</span></b><small>Online English Lessons</small></div>
    <div class="spacer"></div>
    <div class="stat timer hidden" id="timer">⏱ 0:00</div>
    <div class="stat hidden" id="answered">0 / 76</div>
  </div>
  <div class="progress" id="progress"></div>
</header>

<main class="wrap" id="app"></main>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- TEST DATA ---------- */
const PARTS = [
  {id:1,title:"Part one",mins:40,sections:[1,2,3,4]},
  {id:2,title:"Part two",mins:40,sections:[5,6,7,8]},
  {id:3,title:"Part three",mins:50,sections:[9,10,11,12]}
];
const MC_INSTR = "Choose the best word or phrase to fill each blank.";
const SECTIONS = {
 1:{type:"mc",skill:"grammar",title:"Grammar",qs:[
  [1,"Roberta _____ from The United States.",["are","is","am","be"]],
  [2,"What's _____ name?",["—","his","him","he"]],
  [3,"My friend _____ in London.",["living","live","lives","is live"]],
  [4,"Where _____?",["works Tom","Tom works","Tom does work","does Tom work"]],
  [5,"I _____ coffee.",["no like","not like","like don't","don't like"]],
  [6,"'_____ to Australia, Ginny?' 'Yes, two years ago.'",["Did you ever go","Do you ever go","Have you ever been","Are you ever going"]],

  [11,"I wish I _____ more money!",["have","had","would have","was having"]],
  [12,"_____ be famous one day?",["Would you like","Would you like to","Do you like","Do you like to"]]]},
 2:{type:"mc",skill:"vocab",title:"Vocabulary",qs:[
  [13,"It's my birthday _____ Friday.",["on","in","at","by"]],
  [14,"I _____ eighteen years old.",["am","have","have got","—"]],
  [15,"I _____ a headache.",["am","do","have","got"]],
  [16,"Do you _____ a uniform at your school?",["carry","wear","use","hold"]],
  [17,"'What time is it?' 'I have no _____.'",["idea","opinion","answer","time"]],
  [18,"The meal was very expensive. Look at the _____!",["ticket","receipt","invoice","bill"]],
  [19,"How many _____ of trousers have you got?",["items","pairs","sets","times"]],
  [20,"Joel came back from his holiday in Brazil looking really _____.",["tanned","sunned","coloured","darkened"]]]},
 3:{type:"reading",skill:"reading",title:"Reading",passage:[
  "'Heavier than air flying machines are impossible,' said the well-known scientist Lord Kelvin in 1895. Thomas Watson, the chairman of IBM in 1943, was wrong too when he said that he thought there would be a world market for only five or so computers.",
  "Predictions can, of course, be wrong, and it is very difficult to predict what the world will be like in 100, 50, or even 20 years from now. But this is something that scientists and politicians often do. They do so because they invent things and make decisions that <mark>shape</mark> the future of the world that we live in.",

  [24,"The article suggests we should live in a _____ way.",["selfish","sustainable","predictable","scientific"]],
  [25,"Choose the best title for the article.",["Predictions and more predictions!","Politicians and scientists","A sustainable future for our children","New inventions"]]]},
 4:{type:"writing",w:1,title:"Writing",label:"Writing 1 · items 26–33",min:80,max:100,mins:20,
  heading:"Introduce yourself to a new pen-friend",
  prompt:"Write a letter or email to your new pen-friend from abroad and introduce yourself. Say where you come from, where you live and give a little information about your family and friends as well as your hobbies and interests. Say how long you have been learning English and how you would like to improve your English."},
 5:{type:"mc",skill:"grammar",title:"Grammar",qs:[
  [34,"Harry can _____ English.",["to speak","speaking","speak","speaks"]],
  [35,"I'm not interested _____ sports.",["for","about","in","to"]],
  [36,"She likes _____ expensive clothes.",["wearing","to wearing","wear","is wearing"]],
  [37,"Harry _____ his father's car when the accident happened.",["was driving","drove","had driven","has been driving"]],
  [38,"I was wondering _____ tell me when the next plane from Chicago arrives?",["could you","can you","if you could","if could you"]],
  [39,"If I _____ him, I would have spoken to him, wouldn't I?",["saw","had seen","have seen","would have seen"]],
  [40,"I like your hair. Where _____?",["do you have cut","have you cut it","do you have cut it","do you have it cut"]],
  [41,"I think Joey must _____ late tonight. His office light is still on.",["have worked","work","be working","to work"]],
  [42,"John tells me Jack's going out with Helen, _____ I find hard to believe.",["which","who","whose","that"]],

 6:{type:"mc",skill:"vocab",title:"Vocabulary",qs:[
  [46,"I usually _____ up at about 7.30.",["go","be","do","get"]],
  [47,"I _____ football every week.",["play","go","do","have"]],
  [48,"My sister _____ the cooking in our house.",["does","makes","cooks","takes"]],
  [49,"Don't forget to _____ the light when you leave the room.",["turn up","turn in","turn off","turn over"]],
  [50,"She was in _____ when she heard the tragic news.",["crying","tears","cries","tearful"]],
  [51,"He _____ that he hadn't stolen the computer, but no one believed him.",["reassured","informed","insisted","persuaded"]],

  [53,"Greg is _____ a lot of time at Yvonne's house these days!",["taking","spending","having","doing"]]]},

/* ---------- PILLS ---------- */
function pills(){
  const items=PARTS.map((p,i)=>{
    const qs=p.sections.flatMap(id=>SECTIONS[id].qs?SECTIONS[id].qs.map(q=>q[0]):[]);
    const done=qs.filter(n=>S.answers[n]!==undefined).length;
    return `<button class="pill ${S.stage===i+1?"active":""}" data-go="${i+1}" ${S.finished?"disabled":""}><span class="n">${i+1}</span>${p.title} <span class="c">${done}/${qs.length}</span></button>`;
  }).join("");
  return `<nav class="pills">${items}<button class="pill ${S.stage===4?"active":""}" data-go="finish" ${S.finished?"":""}><span class="n">★</span>Results</button></nav>`;
}

function stemHTML(q){
  const n=q[0],sel=S.answers[n];
  const stem=esc(q[1]);
  if(!stem.includes("_____")) return stem;
  const fill=sel!==undefined?`<span class="blank filled">${esc(q[2][sel]==="—"?"Ø":q[2][sel])}</span>`:`<span class="blank"></span>`;
  return stem.replace("_____",fill);
}
function qHTML(q,col){
  const n=q[0],sel=S.answers[n];
  return `<div class="q ${sel!==undefined?"done":""}" id="q${n}">
    <div class="qn">QUESTION ${n}</div>
    <div class="stem">${stemHTML(q)}</div>
    <div class="opts ${col?"col":""}">${q[2].map((o,i)=>`<button class="chip ${sel===i?"sel":""}" data-q="${n}" data-o="${i}"><span class="l">${"abcd"[i]}</span>${o==="—"?"— (nothing)":esc(o)}</button>`).join("")}</div>
  </div>`;
}
function sectionHTML(id){
  const s=SECTIONS[id], num=String(id).padStart(2,"0");
  const skillTag={grammar:"Grammar",vocab:"Vocabulary",reading:"Reading"};
  if(s.type==="mc") return `<section class="section fade">
    <div class="sec-head"><div class="bignum">${num}</div><div><span class="tag">${skillTag[s.skill]}</span><h2>Section ${id}</h2><p class="instr">${MC_INSTR}</p></div></div>
    <div class="qgrid">${s.qs.map(q=>qHTML(q)).join("")}</div></section>`;
  if(s.type==="reading") return `<section class="section fade">
    <div class="sec-head"><div class="bignum">${num}</div><div><span class="tag">Reading</span><h2>Section ${id}</h2><p class="instr">Read the text. For questions ${s.qs[0][0]}–${s.qs[s.qs.length-1][0]}, choose the best answer.</p></div></div>
    <div class="reading"><div class="passage">${s.passage.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="qs">${s.qs.map(q=>qHTML(q,true)).join("")}</div></div></section>`;
  const t=S.writing[s.w]||"", wc=words(t);
  return `<section class="section fade">
    <div class="sec-head"><div class="bignum">${num}</div><div><span class="tag">Writing</span><h2>Section ${id}</h2><p class="instr">${s.label} · about ${s.mins} minutes</p></div></div>

        <textarea data-w="${s.w}" placeholder="Start writing here…" spellcheck="false">${esc(t)}</textarea>

      </div>
    </div></section>`;
}
function updateMeter(w){
  const s=Object.values(SECTIONS).find(x=>x.w==w), n=words(S.writing[w]||"");

  b.textContent=n;
  const m=document.querySelector(`[data-wm="${w}"]`); m.style.width=Math.min(100,n/s.max*100)+"%"; m.classList.toggle("ok",n>=s.min&&n<=s.max);
  const t=document.querySelector(`[data-wt="${w}"]`); t.classList.toggle("ok",n>=s.min&&n<=s.max);
  t.textContent=n>s.max?`a bit long (max ${s.max})`:n>=s.min?"✓ good length":`target ${s.min}–${s.max}`;
}

app.addEventListener("click",e=>{

    const n=+c.dataset.q,o=+c.dataset.o; S.answers[n]=o; save();
    const box=document.getElementById("q"+n);
    box.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",+x.dataset.o===o));

    box.querySelector(".stem").innerHTML=stemHTML(q);

    msg=`<p>You still have <b>${missing.length} unanswered question${missing.length===1?"":"s"}</b>${wMissing.length?` and <b>${wMissing.length} empty writing task${wMissing.length>1?"s":""}</b>`:""}.</p>

      writing:"Write persuasive, well-structured proposals, reports and sensitive emails with a precise, professional style."},
  C2:{listening:"Understand any business English with ease, including fast, idiomatic exchanges.",
      reading:"Read any business or legal text with ease, including subtle points.",
      speaking:"Negotiate and present with complete precision and nuance.",
      writing:"Write polished documents in any business genre with full control of tone."}
 }
};
let track="general";
function candoHTML(levelName){
  const [now,next]=NOW_NEXT[levelName];
  return `<div class="card fade" id="cando" style="margin-top:24px">
    <div class="cando-head">
      <div><span class="eyebrow">What this level means · CEFR</span>
      <h2 style="font-size:30px">What you can do in English</h2></div>
      <div class="seg" role="tablist">
        <button class="${track==="general"?"on":""}" data-track="general">General English</button>
        <button class="${track==="business"?"on":""}" data-track="business">Business English</button>
      </div>
    </div>
    <div class="cando-grid">${SKILLS.map(([k,ic,t])=>`
      <div class="skill">
        <div class="sk-h"><span>${ic}</span>${t}</div>
        <p class="now"><span class="tag">${now} · now</span>${CANDO[track][now][k]}</p>
        <p class="next"><span class="tag next-tag">${next} · next goal</span>${CANDO[track][next][k]}</p>
      </div>`).join("")}
    </div>
    <p class="tiny" style="margin-top:14px">Based on the Common European Framework of Reference (CEFR). This test measures grammar, vocabulary, reading and writing; listening and speaking show what is typical at this level.</p>
  </div>`;
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-track]"); if(!b) return;
  track=b.dataset.track;
  const el=document.getElementById("cando"); el.outerHTML=candoHTML(S.result.level.name);
});


/* ---------- REVIEW (only after submitting) ---------- */
let rvFilter="wrong";
function reviewHTML(){
  const r=S.result; if(!r.review) return "";
  const byN={}; r.review.forEach(x=>byN[x.n]=x);
  const nWrong=r.review.filter(x=>!x.ok).length;
  const skillName={grammar:"Grammar",vocab:"Vocabulary",reading:"Reading"};
  let html="";
  Object.entries(SECTIONS).forEach(([id,s])=>{
    if(!s.qs) return;
    const items=s.qs.filter(q=>rvFilter==="all"||!byN[q[0]].ok);
    if(!items.length) return;
    html+=`<div class="rv-sec">Section ${id} · ${skillName[s.skill]}</div>`;
    items.forEach(q=>{
      const x=byN[q[0]], opt=i=>q[2][i]==="—"?"— (nothing)":esc(q[2][i]);
      const stem=esc(q[1]).replace("_____",`<span class="blank filled">${q[2][x.correct]==="—"?"Ø":esc(q[2][x.correct])}</span>`);
      html+=`<div class="rv ${x.ok?"":"bad"}">
        <div class="rh"><span class="mark">${x.ok?"✓":"✗"}</span>Question ${q[0]}</div>
        <div class="rs">${stem}</div>
        <div class="ans">${x.chosen===null?`<span class="yours bad">No answer</span>`:`<span class="yours ${x.ok?"":"bad"}">Your answer: ${"abcd"[x.chosen]}) ${opt(x.chosen)}</span>`}
          ${x.ok?"":`<span class="right">Correct: ${"abcd"[x.correct]}) ${opt(x.correct)}</span>`}</div>
        <p class="why"><b>Why?</b> ${esc(x.why||"")}</p>
      </div>`;
    });
  });
  if(!html) html=`<p style="margin-top:16px">🎉 No wrong answers — amazing!</p>`;
  return `<div class="card fade" id="review" style="margin-top:24px">
    <div class="cando-head">
      <div><span class="eyebrow">🔍 Review</span><h2 style="font-size:30px">Your answers, explained</h2></div>
      <div class="seg"><button class="${rvFilter==="wrong"?"on":""}" data-rv="wrong">Wrong (${nWrong})</button><button class="${rvFilter==="all"?"on":""}" data-rv="all">All (76)</button></div>
    </div>${html}</div>`;
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-rv]"); if(!b) return;
  rvFilter=b.dataset.rv; document.getElementById("review").outerHTML=reviewHTML();
});


/* sends the report to Renan through Netlify Forms (dashboard + email notification) */
async function sendToRenan(){
  if(S.sent || !S.result || !S.result.form) return;
  try{
    const res=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(S.result.form).toString()});
    if(res.ok){S.sent=true;save();}
  }catch(e){}
}

/* ---------- SUBMIT (scored on the server) ---------- */
let submitting=false;
async function submit(){
  if(submitting) return; submitting=true;
  updateTop();
  app.innerHTML=`<section class="hero fade" style="min-height:360px">${heroArt}
    <span class="eyebrow">${esc(S.name)} · Test finished</span>
    <h1>Correcting your test…</h1>
    <p class="lead">This takes about 20 seconds. Please don't close this page.</p></section>`;
  scrollTo({top:0});
  try{
    const res=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:S.name,answers:S.answers,writing:S.writing,minutes:S.start?Math.round((S.finishedAt-S.start)/60000):null})});
    if(!res.ok) throw new Error("HTTP "+res.status);
    S.result=await res.json(); save();
    submitting=false; renderResults(); sendToRenan();
  }catch(e){
    submitting=false;
    app.innerHTML=`<section class="hero fade">${heroArt}
      <span class="eyebrow">Connection problem</span>
      <h1>We couldn't correct your test.</h1>
      <p class="lead">Your answers are saved. Check your internet and try again.</p>
      <div class="actions"><button class="btn light" id="retry">Try again →</button></div></section>`;
    $("#retry").onclick=submit;
  }
}

/* ---------- RESULTS ---------- */
function renderResults(){
  const r=S.result, L=r.level, idx=LEVELS.findIndex(l=>l.name===L.name);
  updateTop();
  const C=2*Math.PI*92, off=C*(1-r.total/100);
  const mins=S.start&&S.finishedAt?Math.round((S.finishedAt-S.start)/60000):null;
  const wLabels={1:"Email to a pen-friend",2:"Story: A Perfect Day",3:"Film review"};
  const wTargets={1:[80,100],2:[150,200],3:[200,220]};
  const wSum=[1,2,3].reduce((a,i)=>a+r.w[i].score,0);
  app.innerHTML=`
  <section class="hero fade">
    <div class="res-hero" style="position:relative">
      <div>
        <span class="eyebrow">${esc(S.name)} · ${r.exact?"Your result":"Estimated result"}</span>
        <div class="levelbig">${L.name}</div>
        <span class="cefr">CEFR ${L.cefr}</span>
        <p class="lead" style="margin-top:20px">${r.exact?"Great job finishing the test! Renan will be in touch about your classes.":"Great job finishing the test! Renan will check your writing to confirm your level."}</p>
      </div>
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" width="220" height="220"><circle cx="110" cy="110" r="92" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="16"/>
        <circle id="ring" cx="110" cy="110" r="92" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1.1s ease-out"/></svg>
        <div class="t"><div><b>${r.total}</b><small>${r.exact?"out of 100":"≈ out of 100"}</small></div></div>
      </div>
    </div>
  </section>

  <div class="card fade">
    <span class="eyebrow">Where you are</span>
    <div class="scale">${LEVELS.map((l,i)=>`<div class="lv ${i===idx?"on":""}"><b>${l.name}</b><span>${l.cefr} · ${l.min}–${l.max}</span></div>`).join("")}</div>
  </div>
  ${candoHTML(L.name)}

  <div class="res-grid fade">
    <div class="card">
      <span class="eyebrow">Multiple choice</span>
      <h2 style="font-size:30px">${r.mc} <span style="color:var(--muted);font-size:20px">/ 76 points</span></h2>
      ${[["Grammar","grammar"],["Vocabulary","vocab"],["Reading","reading"]].map(([t,k])=>`<div class="bar"><div class="top2"><span>${t}</span><span>${r.by[k][0]} / ${r.by[k][1]}</span></div><div class="track"><i data-w="${r.by[k][0]/r.by[k][1]*100}"></i></div></div>`).join("")}
      ${mins!==null?`<p class="tiny">Time: ${Math.floor(mins/60)}h${String(mins%60).padStart(2,"0")}</p>`:""}
    </div>
    <div class="card">
      <span class="eyebrow">Writing</span>
      <h2 style="font-size:30px">${wSum} <span style="color:var(--muted);font-size:20px">/ 24 points${r.exact?"":" (estimate)"}</span></h2>
      ${[1,2,3].map(i=>{const w=r.w[i],n=words(S.writing[i]||"");
        const badge=w.status==="empty"?`<span class="badge">not written · 0/8</span>`:w.status==="ai"?`<span class="badge ok">${w.score} / 8</span>`:`<span class="badge">Renan will mark</span>`;
        return `<div class="wres"><div class="h"><span>${i} · ${wLabels[i]}</span>${badge}</div><p>${n} words (target ${wTargets[i][0]}–${wTargets[i][1]})${w.comment?" · "+esc(w.comment):""}</p></div>`;}).join("")}
    </div>
  </div>

  ${reviewHTML()}
  <div class="card fade" style="margin:24px 0 80px">
    <span class="eyebrow">📩 Done!</span>
    <h2 style="font-size:28px">Renan has received your result</h2>
    <p style="color:var(--muted)">Your result was sent to Renan automatically. If you want, you can also copy it and send it on WhatsApp.</p>
    <div class="actions"><button class="btn ghost" id="copy">Copy my result</button></div>
  </div>`;
  requestAnimationFrame(()=>{ $("#ring").style.strokeDashoffset=off; document.querySelectorAll(".track i").forEach(i=>i.style.width=i.dataset.w+"%"); });
  $("#copy").onclick=copyResult;
}

function resultText(){
  const r=S.result, L=r.level;
  const lines=[
    `PLACEMENT TEST (Full) — ${S.name}`,
    `Date: ${new Date(S.finishedAt||Date.now()).toLocaleString("pt-BR")}`,
    `Time: ${S.start&&S.finishedAt?Math.round((S.finishedAt-S.start)/60000)+" min":"?"}`,
    ``,
    `${r.exact?"TOTAL":"ESTIMATED TOTAL"}: ${r.total}/100 → ${L.name} (${L.cefr})`,
    `Multiple choice: ${r.mc}/76 (Grammar ${r.by.grammar[0]}/36 · Vocabulary ${r.by.vocab[0]}/24 · Reading ${r.by.reading[0]}/16)`,
    `Writing: ${[1,2,3].map(i=>`W${i} ${r.w[i].status==="pending"?"? (not marked)":r.w[i].score+"/8"}`).join(" · ")}`,
    ``
  ];
  [1,2,3].forEach(i=>{const w=r.w[i]; lines.push(`--- WRITING ${i} (${words(S.writing[i]||"")} words)${w.comment?" — "+w.comment:""} ---`, (S.writing[i]||"").trim()||"(empty)", "");});
  return lines.join("\n");
}
async function copyResult(){
  const txt=resultText();
  try{await navigator.clipboard.writeText(txt); toast("Copied ✓");}
  catch(e){
    openModal(`<h2 style="font-size:24px">Copy your result</h2><p class="tiny">Select all the text below and copy it.</p><textarea style="width:100%;height:260px;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:16px;padding:12px">${esc(txt)}</textarea><div class="row"><button class="btn" data-m="ok">Done</button></div>`);
  }
}

render();
if(RESET) setTimeout(()=>toast("New test ready ✓"),300);
window.addEventListener("hashchange",()=>{ if(location.hash==="#novo-teste") location.reload(); });
</script>

<!-- Netlify Forms: hidden form so Netlify detects the fields at deploy time -->
<form name="placement-results" netlify netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="level"><input name="total"><input name="multiple_choice">
  <input name="wrong_questions"><input name="writing_scores"><textarea name="full_report"></textarea>
</form>
</body>
</html>
